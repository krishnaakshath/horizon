name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Mintaka version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV model and Android version
      placeholder: "Model, Android 11"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How was it installed
      options: [adb install, tvtool provision, built from source]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove IP addresses, account names and other personal data first.
